<!DOCTYPE html>
<html>
<body>
<h3>DiscoverIQ Agent (RAG)</h3>

<input type="file" id="f">
<button onclick="preview()">Preview</button>
<button onclick="upload()">Upload</button>

<div id="out"></div>

<textarea id="t"></textarea>
<button onclick="send()">Send</button>

<hr>
<h4>Sources used</h4>
<pre id="src"></pre>

<script>
let sid = localStorage.sid || crypto.randomUUID();
localStorage.sid = sid;

async function send(){
 let r = await fetch("/chat",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
     session_id:sid,
     message:t.value
   })
 });
 let d = await r.json();

 out.innerHTML += `<p><b>Agent:</b> ${d.reply}</p>`;
 src.textContent = JSON.stringify(d.sources,null,2);
}

async function preview(){
 let fd=new FormData();
 fd.append("file",f.files[0]);
 let r=await fetch("/preview",{method:"POST",body:fd});
 let d=await r.json();
 out.innerHTML = JSON.stringify(d,null,2);
}

async function upload(){
 let fd=new FormData();
 fd.append("file",f.files[0]);
 fd.append("session_id",sid);

 let r=await fetch("/upload",{method:"POST",body:fd});
 let d=await r.json();

 out.innerHTML = `Indexed records: ${d.records}`;
}
</script>
</body>
</html>
