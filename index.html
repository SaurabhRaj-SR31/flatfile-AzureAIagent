<!DOCTYPE html>
<html>
<head>
<title>Flatfile Agent</title>
<style>
body{font-family:system-ui;background:#f3f4f6;padding:20px;}
.wrap{background:#fff;border-radius:12px;
max-width:900px;margin:auto;padding:15px;}
.msg{margin:6px;}
.user{text-align:right;}
.agent{text-align:left;}
.bubble{display:inline-block;padding:8px;border-radius:8px;}
.user .bubble{background:#2563eb;color:white;}
.agent .bubble{background:#e5e7eb;}
</style>
</head>

<body>
<div class="wrap">

<h3>Flatfile Agent</h3>

<div id="msgs"></div>

<input type="file" id="file">

<br><br>

<button onclick="preview()">Preview</button>
<button onclick="upload()">Upload</button>

<hr>

<textarea id="txt"></textarea>
<button onclick="send()">Send</button>

</div>

<div id="modal" style="
display:none;
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,.6);
">
<div style="
background:white;
margin:5% auto;
width:80%;
padding:15px;
">
<h4>Preview (first 10 rows)</h4>
<table border="1" id="ptable"></table>
<br>
<button onclick="closeP()">Close</button>
</div>
</div>

<script>
let sid=localStorage.sid||crypto.randomUUID();
localStorage.sid=sid;

function add(role,text){
let d=document.createElement("div");
d.className="msg "+role;
d.innerHTML=`<div class="bubble">${text}</div>`;
msgs.appendChild(d);
}

add("agent","Upload file or chat");

async function send(){
let t=txt.value;
add("user",t);
txt.value="";

let r=await fetch("/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
session_id:sid,
message:t
})
});
let d=await r.json();
add("agent",d.reply||d.error);
}

async function preview(){
let f=file.files[0];
if(!f)return;

let fd=new FormData();
fd.append("file",f);

let r=await fetch("/preview",{method:"POST",body:fd});
let d=await r.json();

ptable.innerHTML="";

let tr="<tr>";
d.columns.forEach(c=>tr+=`<th>${c}</th>`);
tr+="</tr>";
ptable.innerHTML+=tr;

d.rows.forEach(r=>{
let t="<tr>";
r.forEach(v=>t+=`<td>${v}</td>`);
t+="</tr>";
ptable.innerHTML+=t;
});

modal.style.display="block";
}

function closeP(){
modal.style.display="none";
}

async function upload(){
let f=file.files[0];
if(!f)return;

let fd=new FormData();
fd.append("file",f);
fd.append("session_id",sid);

let r=await fetch("/upload",{method:"POST",body:fd});
let d=await r.json();

add("agent",
`NDJSON uploaded
Records: ${d.records}`);
}
</script>
</body>
</html>
